<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
    </header>

    <main class="comida-container" id="comidaContainer">
    </main>    

    <section class="addFood">
      <form id="agregarComida">
        <input type="text" id="nombreComida" placeholder="Nombre de la comida" required>
        <input type="text" id="categoriaComida" placeholder="Categoría" required>
        <input type="text" id="provinciaComida" placeholder="Provincia" required>
        <input type="text" id="ingredientesComida" placeholder="Ingredientes (separados por coma)">
        <button type="submit">Agregar Comida</button>
      </form> 
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
